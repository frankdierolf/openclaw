services:
  openclaw:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /home/node
      NODE_ENV: production
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      gateway.trustedProxies: ${gateway.trustedProxies:-["*"]}
      TZ: ${TZ:-UTC}
    volumes:
      - openclaw-data:/home/node/.openclaw
    expose:
      - "18789"
    restart: unless-stopped
    # NOTE: No custom Traefik labels - let Coolify handle routing.
    # In Coolify UI, set:
    #   - Domain: https://openclaw.lay.haus
    #   - Ports Exposes: 18789
    # This ensures both HTTP and WebSocket requests route correctly.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/__openclaw__/canvas/').then(r=>{if(!r.ok)throw 1;process.exit(0)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
      - --allow-unconfigured

volumes:
  openclaw-data:
